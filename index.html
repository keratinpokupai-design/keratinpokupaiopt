<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌿 Кератин Покупай — Оптовый заказ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f1117; --card:#1a1d27; --card-a:#1e2233; --brd:#2a2d3a;
  --t:#e4e4e7; --t2:#9ca3af; --acc:#6ee7b7; --acc2:#34d399;
  --green:#34d399; --blue:#60a5fa; --purple:#a78bfa; --r:12px;
}
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--t); -webkit-font-smoothing:antialiased; }
.app { max-width:640px; margin:0 auto; padding-bottom:140px; }

/* HEADER */
.hdr { position:sticky; top:0; z-index:100; background:linear-gradient(to bottom,var(--bg) 80%,transparent); padding:16px 16px 0; }
.hdr-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.logo { font-size:15px; font-weight:800; color:var(--acc); letter-spacing:-0.3px; white-space:nowrap; }
.badge { font-size:11px; color:var(--t2); background:var(--card); padding:3px 8px; border-radius:20px; white-space:nowrap; }

/* SEARCH */
.srch { position:relative; margin-bottom:10px; }
.srch-i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--t2); font-size:14px; pointer-events:none; }
.srch input { width:100%; padding:11px 14px 11px 38px; background:var(--card); border:1px solid var(--brd); border-radius:var(--r); color:var(--t); font-size:14px; font-family:inherit; outline:none; transition:border-color .2s; }
.srch input:focus { border-color:var(--acc); }
.srch input::placeholder { color:var(--t2); }

/* TABS */
.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:14px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex-shrink:0; padding:6px 13px; font-size:12px; font-weight:700; border-radius:20px; border:1px solid var(--brd); background:transparent; color:var(--t2); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .2s; }
.tab:hover { border-color:var(--t2); }
.tab.on { background:var(--acc); color:var(--bg); border-color:var(--acc); }

/* SECTIONS */
.sec { padding:0 16px; margin-bottom:6px; }
.sec-t { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--t2); padding:12px 0 6px; position:sticky; top:108px; background:var(--bg); z-index:10; }

/* PRODUCT ROW */
.pr { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:var(--r); margin-bottom:4px; background:var(--card); border:1px solid transparent; transition:all .15s; gap:10px; }
.pr.on { border-color:var(--acc); background:var(--card-a); }
.pr-nfo { flex:1; min-width:0; }
.pr-nm { display:block; font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; }
.pr-px { display:flex; gap:8px; margin-top:2px; align-items:center; }
.pr-rrc { font-size:12px; color:var(--t2); }
.pr.on .pr-rrc { text-decoration:line-through; }
.pr-opt { font-size:13px; font-weight:700; color:var(--acc); }
.pr-ctl { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.qw { display:flex; background:var(--bg); border-radius:8px; overflow:hidden; border:1px solid var(--brd); }
.qb { width:32px; height:32px; border:none; background:transparent; color:var(--t); font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; }
.qb:hover { background:var(--card); }
.qb:disabled { opacity:.3; }
.qi { width:40px; text-align:center; border:none; background:transparent; color:var(--t); font-size:14px; font-weight:700; font-family:inherit; outline:none; -moz-appearance:textfield; }
.qi::-webkit-outer-spin-button,.qi::-webkit-inner-spin-button { -webkit-appearance:none; }
.pr-sm { font-size:12px; font-weight:700; color:var(--acc2); }

/* TIER BAR */
.tier { margin:0 16px 8px; padding:10px 14px; background:var(--card); border-radius:var(--r); border:1px solid var(--brd); }
.tier-l { display:flex; justify-content:space-between; font-size:11px; margin-bottom:6px; }
.tier-c { font-weight:700; }
.tier-n { color:var(--t2); }
.tier-tr { height:4px; background:var(--brd); border-radius:2px; overflow:hidden; }
.tier-f { height:100%; border-radius:2px; transition:width .4s ease,background .3s; }

/* SUMMARY */
.sum-bar { position:fixed; bottom:0; left:0; right:0; z-index:200; background:linear-gradient(to top,var(--bg) 70%,transparent); padding:20px 16px 16px; }
.sum-in { max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--brd); border-radius:16px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.sum-tot { font-size:22px; font-weight:800; letter-spacing:-.5px; }
.sum-ti { font-size:12px; font-weight:700; }
.sum-gap { color:var(--t2); font-weight:400; }
.sum-cnt { font-size:11px; color:var(--t2); margin-top:1px; }
.sum-r { display:flex; gap:8px; align-items:center; }
.b-clr { padding:8px 14px; border-radius:10px; border:1px solid var(--brd); background:transparent; color:var(--t2); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.b-clr:hover { border-color:var(--t2); color:var(--t); }
.b-ord { padding:10px 20px; border-radius:10px; border:none; background:var(--acc); color:var(--bg); font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
.b-ord:hover { background:var(--acc2); }
.b-ord:disabled { opacity:.4; cursor:default; }

/* MODAL */
.mo { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; display:flex; align-items:flex-end; justify-content:center; padding:16px; animation:fi .2s; }
@keyframes fi { from{opacity:0} to{opacity:1} }
.mo-box { background:var(--card); border-radius:20px 20px 16px 16px; padding:24px 20px 20px; max-width:640px; width:100%; max-height:80vh; overflow-y:auto; position:relative; animation:su .3s ease; }
@keyframes su { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
.mo-x { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--t2); font-size:18px; cursor:pointer; }
.mo-t { font-size:18px; font-weight:800; margin-bottom:16px; }
.mo-ff { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.mo-i { padding:11px 14px; background:var(--bg); border:1px solid var(--brd); border-radius:10px; color:var(--t); font-size:14px; font-family:inherit; outline:none; }
.mo-i:focus { border-color:var(--acc); }
.mo-i::placeholder { color:var(--t2); }
.mo-items { max-height:35vh; overflow-y:auto; margin-bottom:12px; }
.mo-it { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--brd); gap:10px; }
.mo-it span:first-child { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mo-it span:last-child { font-weight:700; flex-shrink:0; }
.mo-total { display:flex; justify-content:space-between; padding:12px 0; font-size:16px; font-weight:800; border-top:2px solid var(--acc); }
.mo-acts { display:flex; gap:10px; margin-top:14px; }
.b-cp,.b-wa { flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; text-align:center; text-decoration:none; border:none; transition:all .2s; }
.b-cp { background:var(--bg); color:var(--t); border:1px solid var(--brd); }
.b-wa { background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center; }
.b-wa:hover { background:#20bd5a; }
.empty { text-align:center; padding:40px 20px; color:var(--t2); font-size:14px; }
.dinfo { margin:4px 16px 10px; font-size:11px; color:var(--t2); text-align:center; background:var(--card); padding:6px 10px; border-radius:8px; border:1px solid var(--brd); }
.hidden { display:none; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hdr">
    <div class="hdr-top">
      <span class="logo">🌿 Кератин Покупай — Оптовый заказ</span>
      <span class="badge" id="countBadge"></span>
    </div>
    <div class="srch">
      <span class="srch-i">🔍</span>
      <input id="searchInput" placeholder="Поиск по названию..." oninput="render()">
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="tierBar" class="tier hidden"></div>
  <div class="dinfo">Скидки: −15% / −25% / −35% · Бразилия 1L: −20% / −30% / −40% · пороги 30 / 60 / 100 тыс ₽</div>
  <div id="products"></div>
</div>

<div class="sum-bar">
  <div class="sum-in">
    <div>
      <div class="sum-tot" id="sumTotal">0 ₽</div>
      <div class="sum-ti" id="sumTier">Нет скидки</div>
      <div class="sum-cnt" id="sumCount">0 поз.</div>
    </div>
    <div class="sum-r">
      <button class="b-clr hidden" id="btnClear" onclick="clearCart()">Очистить</button>
      <button class="b-ord" id="btnOrder" disabled onclick="openModal()">Оформить →</button>
    </div>
  </div>
</div>

<div class="mo hidden" id="modal" onclick="closeModal()">
  <div class="mo-box" onclick="event.stopPropagation()">
    <button class="mo-x" onclick="closeModal()">✕</button>
    <h2 class="mo-t">Оформление заказа</h2>
    <div class="mo-ff">
      <input class="mo-i" id="moName" placeholder="Имя / Компания">
      <input class="mo-i" id="moPhone" placeholder="Телефон / Telegram">
    </div>
    <div class="mo-items" id="moItems"></div>
    <div class="mo-total" id="moTotal"></div>
    <div class="mo-acts">
      <button class="b-cp" id="btnCopy" onclick="copyOrder()">Копировать текст</button>
      <a class="b-wa" id="btnWa" href="#" target="_blank">WhatsApp →</a>
    </div>
  </div>
</div>

let cart = new Array(P.length).fill(0);
let activeCat = "Все";

function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")}

function getTier(s){for(let i=TIERS.length-1;i>=0;i--)if(s>=TIERS[i].min)return i;return 0}

function calcTotals(){
  let s30=0; cart.forEach((q,i)=>{if(q>0)s30+=q*P[i].d});
  let ti=getTier(s30);
  let tk=TIERS[ti].key;
  let sa=0,cnt=0; cart.forEach((q,i)=>{if(q>0){sa+=q*P[i][tk];cnt++}});
  return {s30,ti,tk,sa,cnt};
}

function initTabs(){
  const el=document.getElementById("tabs");
  let h='<button class="tab on" onclick="setCat('Все')">Все</button>';
  CATS.forEach(c=>{h+=`<button class="tab" onclick="setCat('${c.replace(/'/g,"\\'")}')">${CSHORT[c]}</button>`});
  el.innerHTML=h;
  document.getElementById("countBadge").textContent=P.length+" поз.";
}

function setCat(c){activeCat=c;updateTabs();render()}
function updateTabs(){
  document.querySelectorAll(".tab").forEach((t,i)=>{
    if(i===0)t.classList.toggle("on",activeCat==="Все");
    else t.classList.toggle("on",CATS[i-1]===activeCat);
  });
}

function setQty(i,v){cart[i]=Math.max(0,v);render()}

  let filtered=P.map((p,i)=>({p,i})).filter(({p})=>{
    if(activeCat!=="Все"&&p.cat!==activeCat)return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!p.cat.toLowerCase().includes(q))return false;
    return true;
  });

    html+="</div>";

  document.getElementById("products").innerHTML=html;

  // Summary
  document.getElementById("sumTotal").textContent=fmt(sa)+" ₽";
  document.getElementById("sumTier").innerHTML=`<span style="color:${TIERS[ti].color}">${TIERS[ti].label}</span>${ti<3&&sa>0?`<span class="sum-gap"> · до след.: ${fmt(TIERS[ti+1].min-s30)} ₽</span>`:""}`;
  document.getElementById("sumCount").textContent=cnt+" поз.";
  document.getElementById("btnClear").classList.toggle("hidden",cnt===0);
  document.getElementById("btnOrder").disabled=cnt===0;
}

function clearCart(){cart.fill(0);render()}

function openModal(){
  const {ti,tk,sa}=calcTotals();
  let items=[];
  cart.forEach((q,i)=>{if(q>0)items.push({p:P[i],q,s:q*P[i][tk]})});
  let h="";
  items.forEach(it=>{h+=`<div class="mo-it"><span>${it.p.name} × ${it.q}</span><span>${fmt(it.s)} ₽</span></div>`});
  document.getElementById("moItems").innerHTML=h;
  document.getElementById("moTotal").innerHTML=`<span>ИТОГО (${TIERS[ti].label})</span><span>${fmt(sa)} ₽</span>`;
  document.getElementById("modal").classList.remove("hidden");
  updateWaLink();
}

function closeModal(){document.getElementById("modal").classList.add("hidden")}

function getOrderText(){
  const {ti,tk,sa}=calcTotals();
  const nm=document.getElementById("moName").value||"—";
  const ph=document.getElementById("moPhone").value||"—";
  let items=[];
  cart.forEach((q,i)=>{if(q>0)items.push({p:P[i],q,s:q*P[i][tk]})});
  return `Заказ от ${nm}\nТел: ${ph}\n${TIERS[ti].label}\n\n`+items.map(it=>`${it.p.name} × ${it.q} = ${fmt(it.s)} ₽`).join("\n")+`\n\nИТОГО: ${fmt(sa)} ₽`;
}

function updateWaLink(){
  document.getElementById("btnWa").href="https://wa.me/?text="+encodeURIComponent(getOrderText());
}

function copyOrder(){
  navigator.clipboard.writeText(getOrderText()).then(()=>{
    const b=document.getElementById("btnCopy");
    b.textContent="✓ Скопировано";
    setTimeout(()=>b.textContent="Копировать текст",2000);
  });
}

document.getElementById("moName").addEventListener("input",updateWaLink);
document.getElementById("moPhone").addEventListener("input",updateWaLink);

initTabs();
render();
</script>
</body>
</html>
